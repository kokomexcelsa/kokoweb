summary:
  zh: |-
    這是我在 AgentCamp - Taoyuan 的演講。AgentCamp 是 Global AI Community 2026 年全球串連活動，本場由 Global AI Taoyuan 主辦；ACCUPASS 與 Global AI Community 頁面都公開列出議程與講者資訊。

    我的議程為「微軟 Agent 服務與 LangGraph 使用 / Build multi-agents with Microsoft Foundry and LangGraph」，內容聚焦 Microsoft Foundry、Azure AI Foundry、LangGraph、MCP 與 multi-agent 架構，協助開發者理解如何把 AI Agent 從單一工具呼叫推進到可協作的 multi-agent 系統。
  en: |-
    This talk was delivered at AgentCamp - Taoyuan, part of Global AI Community's AgentCamp 2026 initiative and hosted by Global AI Taoyuan. Both the ACCUPASS page and the Global AI Community page publicly list the agenda and speaker information.

    My session was Build multi-agents with Microsoft Foundry and LangGraph. It focused on Microsoft Foundry, Azure AI Foundry, LangGraph, MCP, and multi-agent architecture, helping developers move from single-tool AI agent patterns toward collaborative multi-agent systems.

summary:
  zh: |-
    這是我擔任 Microsoft Agentic AI Hackathon 2025 技術專家的公開紀錄。活動由數位發展部數位產業署與台灣微軟共同主辦，聚焦企業 AI Agent 與 Multi-Agent 應用；活動頁列出 Ko Ko / 大魔術熊貓工程師作為 Microsoft AI MVP 技術專家。

    這筆貢獻不是一般演講，而是針對參賽隊伍提供技術方向、架構可行性與 Agentic AI 實作建議。它能佐證我在 Microsoft AI 生態系中的 mentoring 與產業應用推廣角色。
  en: |-
    This is the public record of my role as a technical expert for Microsoft Agentic AI Hackathon 2025. The event was co-hosted by Taiwan's Administration for Digital Industries and Microsoft Taiwan, focusing on enterprise AI Agent and multi-agent applications; the page lists Ko Ko / Magic Panda Engineer as a Microsoft AI MVP technical expert.

    This contribution was mentoring rather than a regular talk. It involved providing finalist teams with technical direction, architecture feasibility feedback, and Agentic AI implementation guidance, demonstrating my mentoring role in the Microsoft AI ecosystem and enterprise AI adoption.

summary:
  zh: |-
    這是我在 .NET Conf 2025 Taiwan 的演講，主題是使用 Azure AI 與 LangGraph 來開發 AI Agent。活動頁公開說明 .NET Conf 2025 Taiwan 的活動日期、地點與 AI/雲端議程方向。

    內容介紹 Azure AI、Microsoft Foundry、LangChain 與 LangGraph，並以 live demo 示範如何使用 Microsoft Foundry 與 LangGraph 打造 AI Agent，讓 .NET 與雲端開發者能把生成式 AI 架構落到可實作的服務流程。
  en: |-
    This talk was delivered at .NET Conf 2025 Taiwan and focused on building AI agents with Azure AI and LangGraph. The public event page describes the event date, venue, and AI/cloud agenda direction.

    The session introduced Azure AI, Microsoft Foundry, LangChain, and LangGraph, with a live demo showing how to build AI agents using Microsoft Foundry and LangGraph so .NET and cloud developers can apply generative AI architecture in practical service workflows.

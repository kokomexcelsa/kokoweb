summary:
  zh: |-
    這是我在 2025 大中華區 MVP 聚技站的 Microsoft Reactor 線上分享。Microsoft Reactor 活動頁公開標示講者為 Microsoft AI MVP Ko Ko，主題是「LangChain 整合 Azure AI Search：打造智能 AI Agent 最佳實踐」。

    內容聚焦在企業知識檢索與 AI Agent 的結合：先說明 LangChain 在 LLM 應用中的角色，再以 Azure AI Search 作為企業級搜尋與知識檢索服務，示範如何讓 Agent 能夠查詢非結構化資料、取得可靠上下文，並提升 RAG/Agent 應用的實務可用性。
  en: |-
    This Microsoft Reactor livestream was part of the 2025 Greater China MVP community series. The public event page lists Microsoft AI MVP Ko Ko as the speaker for a session on integrating LangChain with Azure AI Search to build intelligent AI agents.

    The talk focused on combining enterprise knowledge retrieval with AI agents. It explained LangChain's role in LLM applications and showed how Azure AI Search can serve as an enterprise search and knowledge retrieval layer, giving agents reliable context over unstructured data and improving the practicality of RAG and agent applications.

summary:
  zh: |-
    這是我在 GDG on Campus NCHU Build with AI 2025 的專家講座。活動頁公開標示我以 GDG Professional 與 Microsoft AI MVP 身分受邀，主題是「AI 之眼打造傳統工廠生產線的升級」。

    分享重點放在傳統工廠導入 AI 的真實限制，包含生產線設備老舊、資料品質、ROI、雲端與邊緣運算取捨、資安門檻，以及如何用 object detection 等 AI 技術改善生產線流程。這筆紀錄能佐證我把 AI/ML 實務經驗帶進校園社群，協助學生理解產業場景。
  en: |-
    This expert session was delivered at GDG on Campus NCHU Build with AI 2025. The public event page identifies me as a GDG Professional and Microsoft AI MVP invited to speak about upgrading traditional factory production lines with AI vision.

    The session focused on real constraints in factory AI adoption, including legacy equipment, data quality, ROI, cloud-versus-edge tradeoffs, security requirements, and how object detection can improve production-line workflows. It demonstrates my contribution to bringing practical AI and ML experience into a university developer community.

  zh: "本次演講是在 NET Conf Taiwan 2022 分享的內容，這是台灣最大的 .net conference 本次演講聚焦在 Azure Machine Learning 的操作上，如何使用 Stable Diffusion 來做 AI 繪圖，並介紹其原理，然後以 Live Demo 來展示如何撰寫程式碼，以達成 Text to image 的任務。"
  en: "The speech was presented at NET Conf Taiwan 2022, the largest .NET conference in Taiwan. The presentation focused on the operation of Azure Machine Learning and how to use Stable Diffusion to create AI-generated artwork. It also introduced the principles behind it and demonstrated how to write code through a live demo to achieve the task of text to image."

  zh: "這場是我在名古屋開源年會所分享的內容。 在這場分享中，我介紹了 Neural Network Intelligence（NNI），一套由微軟開發的開源工具。 內容包含了如何使用 NNI 來做 AutoML、Hyperparameter tuning、Feature engineering、Neural Architecture Search，以及如何整合使用 Azure Machine Learning。"

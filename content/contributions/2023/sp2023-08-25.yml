summary:
  zh: "這場是我在 Alpha Camp 所舉辦的 AI Builder Day 活動分享的主題。 在這次分享中，我介紹了如何使用 Hugging Face 的模型來開發實戰應用，並分享了 Azure Machine Learning 與 Hugging Face 的整合。 此外，我也分享了許多實戰技巧，幫助大家更有效率地開發 LLM 應用並且解決問題。"
  en: "This session was shared in AI Builder Day event held by Alpha Camp. In this session, I introduced how to develop practical applications with Hugging Face models and shared the integration of Azure Machine Learning with Hugging Face. In addition, I also shared many practical tips to help everyone develop LLM applications more efficiently and solve problems."

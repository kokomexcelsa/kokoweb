summary:
  zh: "這場是我在 2023 Global AI Bootcamp 分享的。 ChatGPT 已成為全球矚目的服務，比歷史上任何其他服務更快地達到了 100 萬使用者。但你是否曾想過 GPT 是什麼，以及 ChatGPT 與其 GPT 家族有何不同？在本議程中，我解釋了 GPT 背後的模型架構，並使用簡單的程式碼幫助聽眾理解和使用 GPT。"
  en: "This session was shared in 2023 Global AI Bootcamp. ChatGPT has become a global sensation, reaching 1 million users faster than any other service in history. But have you ever wondered what GPT is and how ChatGPT differs from its GPT family? In this session, I explained the model architecture behind GPT and use simple code with Azure Machine Learning to help the audiences understand and use GPT."

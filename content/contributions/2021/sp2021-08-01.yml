summary:
  zh: "這場演講是在開源人年會（COSCUP）分享的。LINE 開啟 webhook 之後，就無法一對一聊天了。本次演講會利用開源的websocket 套件，SignalR，在LIFF裡建立一對一聊天的管道，試圖解決客服問題。"
  en: "This topic was shared in Conference for Open Source Coders, Users, and Promoters(COSCUP), which is the largest open source conference in Taiwan. As we known, it cannot have 1-1 chat once activating webhook in LINE channel. This speech will use open-source library, SignalR, building 1-1 chat in LIFF. It might solve customer service issues."
